# thresholds.yaml — 阈值与权重 v0.2（scenario pack 策略数据）
# v0.2（2026-09-27，PM 批准 evt-0002/3/4）：fixability 键对齐九类 taxonomy、双公式声明、
# focus 温度档位收编、pass^k 对外口径固定。黄金决策池积累后，govern 提案调整，人批准才生效。

scoring:
  judge_repeats: 2               # 每条每维跑几遍（本地免费，用重复换稳定）
  order_swap: true               # 成对比较交换顺序
  min_confidence_to_record: 0.5  # 低于此置信的记分标 low_confidence

arbitration:
  unanimous: "3:0 → 直接记分"
  majority_with_golden: "2:1 且该维有确定性 gold 源 → gold 裁决"
  majority_without_golden: "2:1 无 gold 源 → 升级 Jev"
  split: "1:1:1 → 升级 Jev"
  jev_fallback: "Jev 不可达 → calibrate 画像中的 lead judge 裁决，degraded 标记 jev_unreachable"
  jev_choice_limit: 255          # Jev Choice 上限，taxonomy 当前 13 类，安全
  sample_audit_rate: 0.05        # 5% 抽样送强 judge 审计

cluster:
  method: "embedding + HDBSCAN"
  rule_fallback_trigger: "HDBSCAN 产出类数 < 2 或样本量 < 50"
  min_cluster_size: 3
  representatives_per_cluster: 3
  labeler: "Jev Choice(分类体系选项) → 不可达时 LLM judge 投票 + 降级标注"

prioritize:
  formula: "priority = frequency_norm * severity_weight * fixability_boost"
  severity_weights: { "3": 1.0, "2": 0.6, "1": 0.3 }
  fixability_boost:              # 可修复性先验 v0.2（人工设定，黄金池校准中；evt-0001 是第一条校准数据）
    F01: 1.0   # wrong_tool：改工具描述通常可修
    F02: 1.2   # wrong_args：常有明确修法
    F03: 1.0   # missing_lookup：加"先查后动"规则
    F06: 1.2   # loop：prompt 规则可修（apply_prompt_fix.sh 三规则实证路径）
    F07: 1.2   # missing_confirmation：加确认步骤规则
    F08: 1.2   # unauthenticated_action：工具层门禁（卡片建议原文）
    F10: 0.8   # hallucinated_info：往往要动模型/检索，不只是 prompt
    F11: 0.7   # policy_violation：常需产品规则联动
    F12: 0.9   # premature_stop：重试/回问策略可修
  formula_runtime: "size × mean(severity)（运行时 cluster 内实现，卡片主显）"
  formula_note: "双公式并存（PM 批准 evt-0003）：卡片主显运行时公式（简单可讲），本三因子公式作黄金池校准载体"
  focus:                         # 呈现层温度档位（v0.2 从 focus.py 技能常量收编进 pack）
    - {name: p0, max_t: 0.35, min_severity: 3, min_share: 0.10, queue_cap: 1}
    - {name: standard, max_t: 0.70, min_severity: 2, min_share: null, queue_cap: 3}
    - {name: full, max_t: 1.01, min_severity: 0, min_share: null, queue_cap: null}
  top_recommendation_count: 1    # 证据卡只给一个"先修这个"，人的注意力是稀缺资源

regress:
  pass_k: 3                      # 对外汇报固定 k=3（PM 批准 evt-0004）
  k_reporting: fixed             # 运行时自适应 k 仅限内部；对外口径固定，trial<3 必须显式标注"本轮 k=N"
  report_bracket: true           # 卡片同时报 pass@k（能力上限）与 pass^k（可靠性下限）+ 区间宽度（稳定性信号）
  estimator: "combinatorial C(c,k)/C(n,k)"   # 接口需求⑤：统一估计器，消灭三种 pass^1 并存
  same_pack_hash_required: true
  gates:
    primary_metric: "task_pass_rate"
    new_severe_cluster_blocks: true   # 引入新的 severity>=3 类 → 不通过
    delta_min: 0.02               # 主指标提升低于 2 个百分点 → 不通过

report:
  confidence_min_for_card: 0.6
  card_audiences: ["pm", "engineer"]
