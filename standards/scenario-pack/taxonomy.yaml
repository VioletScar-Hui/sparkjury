# taxonomy.yaml — 失败分类体系 v0.2（scenario pack 策略数据）
# v0.2 变更（PM 批准 evt-0002，2026-09-27）：pack 迁就运行时 FailureLabel——
# 类目收敛为运行时 9 个标签 + F99 人工队列；F-id 保留为规范 id（黄金池事件、
# fixability 键、govern 投影的 F\d\d 约定全部继续有效），新增 runtime_label
# 字段承载与 src/sparkjury/models/cluster.py FailureLabel 的 1:1 映射。
# 消费方（prioritize/thin_candidates）凭 runtime_label 自动翻译，
# 不再需要手工映射表。cluster/report 只消费本文件的 id 与 runtime_label。

meta:
  version: 0.2.0
  owner: "万凌"
  status: "active — 与运行时 FailureLabel 对齐（源：MAST/TRAIL 收敛版）"
  runtime_source: "src/sparkjury/models/cluster.py::FailureLabel"

categories:
  - id: F01
    runtime_label: wrong_tool
    name: 工具选择错误
    definition: "意图对，但选了不该用的工具"
    default_severity: 2
    example: "改地址时误调了取消订单接口"

  - id: F02
    runtime_label: wrong_args
    name: 工具参数错误
    definition: "工具选对，参数错误或缺失"
    default_severity: 2
    example: "order_id 串号 / 新地址写进旧字段"

  - id: F03
    runtime_label: missing_lookup
    name: 未查先动
    definition: "没有读取记录就行动或作答"
    default_severity: 2
    example: "未查库存直接创建退货单"

  - id: F06
    runtime_label: loop
    name: 循环空转
    definition: "重复同一动作，永不收敛"
    default_severity: 2
    example: "同一调用失败后原样重试直至耗尽轮次（2026-09-27 真实基线主导失败，53%）"

  - id: F07
    runtime_label: missing_confirmation
    name: 缺确认的破坏性操作
    definition: "破坏性动作没有拿到用户明确同意"
    default_severity: 3
    example: "未经二次确认直接取消订单"

  - id: F08
    runtime_label: unauthenticated_action
    name: 未验身份即操作
    definition: "验证用户身份之前就执行了动作"
    default_severity: 3
    example: "没有 find_user_id_* 就执行写操作"

  - id: F10
    runtime_label: hallucinated_info
    name: 虚构事实
    definition: "陈述了没有任何工具结果支撑的事实"
    default_severity: 2
    example: "工具返回退款失败，回复却说已退款成功"

  - id: F11
    runtime_label: policy_violation
    name: 违反业务规则
    definition: "破坏了领域策略（退款上限、交换规则等）"
    default_severity: 3
    example: "超出退款额度仍执行退款"

  - id: F12
    runtime_label: premature_stop
    name: 提前放弃
    definition: "目标未达成即结束"
    default_severity: 2
    example: "第三次工具超时后直接结束会话"

  - id: F99
    runtime_label: other
    name: 未分类
    definition: "无法落入以上类目，进入人工裁决队列（永不进 Thin 候选、永不自动贴标签）"
    default_severity: 1
    example: ""
